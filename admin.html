<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/ysr-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/ysr-logo.png">
    <style>
        /* --- 1. SETUP & VARS --- */
        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --accent-primary: #06B6D4;
            --accent-secondary: #8B5CF6;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --accent-highlight: #F59E0B;
            --accent-danger: #EF4444;
            --accent-primary-rgb: 6, 182, 212;
            --accent-secondary-rgb: 139, 92, 246;
            --text-primary-rgb: 255, 255, 255;
            --shadow-rgb: 0, 0, 0;
            --danger-rgb: 239, 68, 68;
            --font-primary: 'Space Grotesk', sans-serif;
            --accent-success: #22c55e;
            --font-secondary: 'Inter', sans-serif;
            --transition-smooth: all 0.3s ease-in-out;
            --border-light: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --accent-primary: #2563EB;
            --accent-secondary: #4F46E5;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent-highlight: #D97706;
            --accent-danger: #DC2626;
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary-rgb: 79, 70, 229;
            --text-primary-rgb: 15, 23, 42;
            --shadow-rgb: 15, 23, 42;
            --danger-rgb: 220, 38, 38;
            --border-light: rgba(15, 23, 42, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-secondary);
            line-height: 1.6;
        }

        /* --- 2. LAYOUT & HEADER --- */
        .admin-header {
            background-color: var(--bg-secondary);
            padding: 1rem 5%;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            text-align: center;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .admin-section {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
        }

        h2 {
            font-family: var(--font-primary);
            color: var(--accent-primary);
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }

        /* --- 3. UPLOAD FORM --- */
        #upload-form {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        #upload-form input[type="file"] {
            color: var(--text-secondary);
        }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition-smooth);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #FFFFFF;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(var(--accent-primary-rgb), 0.3);
        }

        .btn-success {
            background: var(--accent-success);
            color: #FFFFFF;
        }

        .btn-success:hover {
            background: #16a34a;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }

        .admin-section form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-section input[type="text"],
        .admin-section textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: var(--font-secondary);
        }

        .form-group {
            width: 100%;
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            width: 100%;
        }
        #champions-list {
            margin-top: 2.5rem;
        }
        .champion-list-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto;
            align-items: center;
            gap: 1.5rem;
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 8px;
        }
        .champion-list-item img {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }
        .champion-info h4 {
            margin: 0;
            font-size: 1.1rem;
        }
        .champion-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .champion-actions {
            display: flex;
            gap: 0.75rem;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-success);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .admin-section form button {
            align-self: flex-start;
        }



        #upload-status {
            margin-top: 1rem;
            font-weight: 600;
        }

        /* --- 4. GALLERY GRID --- */
        #admin-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .gallery-message {
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .admin-gallery-item {
            position: relative;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        .admin-gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-primary) 0%, transparent 100%);
            padding: 2rem 1rem 1rem;
            display: flex;
            justify-content: flex-end;
        }

        .btn-delete {
            background-color: var(--accent-danger);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 5px;
        }
        .btn-edit {
            background-color: var(--accent-highlight);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .btn-delete:hover {
            background-color: #ff1a1a;
            box-shadow: 0 0 10px rgba(var(--danger-rgb), 0.5);
        }

        /* --- 5. MANAGEMENT LISTS (NOTICES/UPDATES) --- */
        .management-list {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: var(--bg-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border-left: 3px solid var(--accent-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item h4 {
            font-family: var(--font-primary);
            font-weight: 500;
            margin: 0;
            padding: 0;
        }
        
        .btn-theme-toggle {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        [data-theme="light"] .sun-icon { display: none !important; }
        [data-theme="light"] .moon-icon { display: block !important; }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>YSR Academy - Gallery Admin Panel</h1>
        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </header>

    <main class="admin-container">
        <section class="admin-section">
            <h2>Upload New Image</h2>
            <form id="upload-form">
                <input type="file" name="galleryImage" id="galleryImage" accept="image/*" required style="color: var(--text-secondary); flex-grow: 1;">
                <button type="submit" class="btn btn-primary">Upload Image</button>
            </form>
            <p id="upload-status"></p>
        </section>

        <section class="admin-section">
            <h2>Manage Gallery</h2>
            <div id="admin-gallery-grid">
                <p class="gallery-message">Loading images...</p>
            </div>
        </section>

        <section class="admin-section" id="champions-admin-section">
            <h2>Manage Champions Banners</h2>
            <form id="champion-banner-form">
                <input type="hidden" id="champion-id">
                <div class="form-group">
                    <label for="champion-title-input">Banner Title</label>
                    <input type="text" id="champion-title-input" placeholder="e.g. JEE Main Topper 2024" required>
                </div>
                <div class="form-group">
                    <label for="champion-image">Banner Image (Recommended: 16:7 ratio, e.g., 1600x700px)</label>
                    <input type="file" id="champion-image" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="champion-order">Display Order</label>
                    <input type="number" id="champion-order" value="0" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Banner</button>
                    <button type="button" id="cancel-edit-btn" class="btn" style="display: none;">Cancel Edit</button>
                </div>
            </form>
            <p id="champion-upload-status"></p>

            <div id="champions-list" class="management-list">
                <p class="gallery-message">Loading banners...</p>
            </div>
        </section>

        <section class="admin-section">
            <h2>Manage Notices</h2>
            <form id="notice-form">
                <input type="text" id="notice-title" placeholder="Notice Title" required>
                <textarea id="notice-content" placeholder="Notice Content (optional)" rows="3"></textarea>
                <button type="submit" class="btn btn-success">Add Notice</button>
            </form>
            <div id="notices-list" class="management-list">
                <p class="gallery-message">No notices yet.</p>
            </div>
        </section>

        <section class="admin-section">
            <h2>Manage Updates</h2>
            <form id="update-form">
                <input type="text" id="update-title" placeholder="Update Title" required>
                <textarea id="update-content" placeholder="Update Content (optional)" rows="3"></textarea>
                <button type="submit" class="btn btn-success">Add Update</button>
            </form>
            <div id="updates-list" class="management-list">
                <p class="gallery-message">No updates yet.</p>
            </div>
        </section>
    </main>

    <!-- Add Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryGrid = document.getElementById('admin-gallery-grid');
            const uploadForm = document.getElementById('upload-form');
            const fileInput = document.getElementById('galleryImage');
            const uploadStatus = document.getElementById('upload-status');

            // Notice Management Elements
            const noticeForm = document.getElementById('notice-form');
            const noticeTitleInput = document.getElementById('notice-title');
            const noticesList = document.getElementById('notices-list');

            // Update Management Elements
            const updateForm = document.getElementById('update-form');
            const updateTitleInput = document.getElementById('update-title');
            const updatesList = document.getElementById('updates-list');

            // --- SUPABASE SETUP ---
            // Use the same Supabase project as the main website for consistency and correct authentication.
            const SUPABASE_URL = "https://mfcpkmhovgjfswjrbuqx.supabase.co";
            const SUPABASE_KEY = "sb_publishable_hFBWwB2dZRtFf6Wioj8W1A_GUB830Tg";
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('✅ Admin Panel Supabase Client Initialized and Corrected.');

            /**
             * Reads images from Supabase and displays them in the grid.
             */
            async function displayImages() {
                console.log('[Gallery] Fetching images from Supabase...');
                try {
                    const { data: images, error } = await supabase
                        .from('gallery')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    
                    console.log(`[Gallery] Successfully fetched ${images.length} images.`);

                    galleryGrid.innerHTML = ''; 

                    if (images.length === 0) {
                        galleryGrid.innerHTML = '<p class="gallery-message">No images in the gallery yet. Upload one!</p>';
                        return;
                    }

                    const fragment = document.createDocumentFragment();
                    images.forEach(image => {
                        const item = document.createElement('div');
                        item.className = 'admin-gallery-item';
                        item.innerHTML = `
                            <img src="${image.image_url}" alt="Gallery Image" loading="lazy" decoding="async">
                            <div class="item-overlay">
                                <button class="btn btn-delete" data-id="${image.id}" style="display: flex; align-items: center; gap: 5px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    Delete
                                </button>
                            </div>
                        `;
                        fragment.appendChild(item);
                    });
                    galleryGrid.appendChild(fragment);
                } catch (error) {
                    console.error('[Gallery] Error fetching gallery images:', error);
                    galleryGrid.innerHTML = '<p class="gallery-message" style="color: var(--accent-danger);">Could not load gallery images.</p>';
                }
            }

            /**
             * Handles the image upload form submission.
             */
            async function handleUpload(e) {
                e.preventDefault();
                const file = fileInput.files[0];
                if (!file) {
                    uploadStatus.textContent = 'Please select a file to upload.';
                    uploadStatus.style.color = 'var(--accent-highlight)';
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    uploadStatus.textContent = 'Invalid file type. Please select an image.';
                    uploadStatus.style.color = 'var(--accent-danger)';
                    return;
                }

                console.log('[Upload] Starting upload process for:', file.name);

                try {
                    uploadStatus.textContent = 'Compressing image...';
                    uploadStatus.style.color = 'var(--accent-secondary)';
                    console.log(`[Upload] Original image size: ${(file.size / 1024 / 1024).toFixed(2)} MB`);
                    
                    const options = { maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: true };
                    const compressedFile = await imageCompression(file, options);
                    
                    console.log(`[Upload] Compressed image size: ${(compressedFile.size / 1024 / 1024).toFixed(2)} MB`);
                    console.log('[Upload] Compression success');

                    uploadStatus.textContent = 'Uploading to cloud...';
                    uploadStatus.style.color = 'var(--accent-primary)';

                    const safeName = (compressedFile.name || 'image.jpg').replace(/[^a-zA-Z0-9.\-_]/g, '_');
                    const fileName = `gallery/${Date.now()}_${safeName}`;
                    
                    console.log('[Upload] upload target path:', fileName);

                    // 1. Upload to Storage
                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from('images')
                        .upload(fileName, compressedFile, {
                            contentType: compressedFile.type,
                            upsert: false
                        });

                    if (uploadError) throw uploadError;
                    console.log('[Upload] Storage upload successful:', uploadData);

                    // 2. Get Public URL
                    const { data: urlData } = supabase.storage
                        .from('images')
                        .getPublicUrl(fileName);
                        
                    console.log('[Upload] Generated public URL:', urlData.publicUrl);

                    // 3. Insert into Database
                    const insertPayload = { image_url: urlData.publicUrl, image_path: fileName };
                    console.log('[Upload] Database insert payload:', insertPayload);
                    console.log("Insert payload:", { image_url: urlData.publicUrl, image_path: fileName });
                    
                    // REBUILT INSERT: Using clean .insert() without .select() to fix 400 error.
                    const { error: insertError } = await supabase
                        .from('gallery')
                        .insert([insertPayload]);

                    if (insertError) throw insertError;
                    console.log('[Upload] Database insert successful.');

                    uploadStatus.textContent = 'Upload successful!';
                    uploadStatus.style.color = 'var(--accent-highlight)';
                    uploadForm.reset();
                    displayImages(); 

                    setTimeout(() => { uploadStatus.textContent = ''; }, 5000);

                } catch (error) {
                    console.error("[Upload] REAL ERROR:");
                    console.dir(error);
                    console.error("Error specifics:", {
                        message: error?.message,
                        details: error?.details,
                        hint: error?.hint,
                        code: error?.code
                    });
                    uploadStatus.textContent = 'Upload failed. See console for details.';
                    uploadStatus.style.color = 'var(--accent-danger)';
                }
            }

            /**
             * Handles the deletion of an image.
             */
            async function deleteGalleryImage(imageId) {
                if (!confirm('Are you sure you want to delete this image? This cannot be undone.')) {
                    return;
                }

                try {
                    console.log('[Delete] delete started');
                    
                    // 1. Read image_path from database row
                    const { data: dbImage, error: fetchError } = await supabase
                        .from('gallery')
                        .select('image_path')
                        .eq('id', imageId)
                        .single();
                        
                    if (fetchError) throw fetchError;
                    
                    const imagePath = dbImage.image_path;
                    console.log('[Delete] stored image_path:', imagePath);
                    console.log('[Delete] delete target path:', imagePath);

                    // 2. Delete from Storage
                    const { error: storageError } = await supabase.storage
                        .from('images')
                        .remove([imagePath]);
                    
                    if (storageError) throw storageError;
                    console.log('[Delete] storage delete success');

                    // 3. Delete from Database
                    const { error: dbError } = await supabase
                        .from('gallery')
                        .delete()
                        .eq('id', imageId);

                    if (dbError) throw dbError;
                    console.log('[Delete] database delete success');

                    alert('Image deleted successfully.');
                    await displayImages();
                    console.log('[Delete] gallery refresh success');
                } catch (error) {
                    console.error('[Delete] exact errors:', error);
                    alert('Could not delete image. Check console.');
                }
            }

            // --- CHAMPION BANNER MANAGEMENT ---
            const championForm = document.getElementById('champion-banner-form');
            const championIdInput = document.getElementById('champion-id');
            const championTitleInput = document.getElementById('champion-title-input');
            const championImageInput = document.getElementById('champion-image');
            const championOrderInput = document.getElementById('champion-order');
            const championStatus = document.getElementById('champion-upload-status');
            const championsList = document.getElementById('champions-list');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');

            async function displayChampionBanners() {
                console.log('[Champions] Fetching banners for admin...');
                try {
                    const { data, error } = await supabase
                        .from('champion_banners')
                        .select('*')
                        .order('display_order', { ascending: true });

                    if (error) throw error;

                    championsList.innerHTML = '';
                    if (data.length === 0) {
                        championsList.innerHTML = '<p class="gallery-message">No banners created yet.</p>';
                        return;
                    }

                    data.forEach(banner => {
                        const item = document.createElement('div');
                        item.className = 'champion-list-item';
                        item.dataset.id = banner.id;
                        item.innerHTML = `
                            <img src="${banner.image_url}" alt="${banner.title}">
                            <div class="champion-info">
                                <h4>${banner.title}</h4>
                                <p>Order: ${banner.display_order}</p>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" class="status-toggle" data-id="${banner.id}" ${banner.is_active ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                            <div class="champion-actions">
                                <button class="btn btn-edit" data-id="${banner.id}">Edit</button>
                                <button class="btn btn-delete" data-id="${banner.id}">Delete</button>
                            </div>
                        `;
                        championsList.appendChild(item);
                    });

                } catch (error) {
                    console.error('[Champions] Error fetching banners for admin:', error);
                    championsList.innerHTML = '<p class="gallery-message" style="color: var(--accent-danger);">Could not load banners.</p>';
                }
            }

            function resetChampionForm() {
                championForm.reset();
                championIdInput.value = '';
                championImageInput.required = true;
                cancelEditBtn.style.display = 'none';
                championForm.querySelector('button[type="submit"]').textContent = 'Save Banner';
            }

            cancelEditBtn.addEventListener('click', resetChampionForm);

            async function handleChampionSubmit(e) {
                e.preventDefault();
                const id = championIdInput.value;
                const file = championImageInput.files[0];

                if (!id && !file) {
                    alert('An image is required when creating a new banner.');
                    return;
                }

                const submitBtn = championForm.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                submitBtn.disabled = true;
                championStatus.textContent = 'Processing...';
                championStatus.style.color = 'var(--text-secondary)';

                try {
                    let imageUrl = null;
                    let imagePath = null;

                    if (file) {
                        championStatus.textContent = 'Compressing image...';
                        const compressedFile = await imageCompression(file, { maxSizeMB: 1, maxWidthOrHeight: 1920 });
                        
                        championStatus.textContent = 'Uploading image...';
                        const fileName = `champions/${Date.now()}_${compressedFile.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
                        
                        const { error: uploadError } = await supabase.storage.from('images').upload(fileName, compressedFile);
                        if (uploadError) throw uploadError;

                        const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
                        imageUrl = urlData.publicUrl;
                        imagePath = fileName;
                    }

                    const payload = {
                        title: championTitleInput.value,
                        display_order: parseInt(championOrderInput.value),
                    };
                    
                    if (imageUrl) payload.image_url = imageUrl;
                    if (imagePath) payload.image_path = imagePath;

                    if (id) { // Update
                        if (imageUrl) { // If new image, delete old one
                            const { data: oldBanner } = await supabase.from('champion_banners').select('image_path').eq('id', id).single();
                            if (oldBanner && oldBanner.image_path) {
                                await supabase.storage.from('images').remove([oldBanner.image_path]);
                            }
                        }
                        const { error } = await supabase.from('champion_banners').update(payload).eq('id', id);
                        if (error) throw error;
                        championStatus.textContent = 'Banner updated successfully!';
                    } else { // Create
                        payload.is_active = true; // Default to active
                        const { error } = await supabase.from('champion_banners').insert([payload]);
                        if (error) throw error;
                        championStatus.textContent = 'Banner created successfully!';
                    }
                    
                    championStatus.style.color = 'var(--accent-success)';
                    resetChampionForm();
                    await displayChampionBanners();

                } catch (error) {
                    console.error('[Champions] Error saving banner:', error);
                    championStatus.textContent = 'Error: ' + error.message;
                    championStatus.style.color = 'var(--accent-danger)';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    setTimeout(() => { championStatus.textContent = ''; }, 5000);
                }
            }

            championsList.addEventListener('click', async (e) => {
                const target = e.target;
                const id = target.dataset.id;

                if (!id) return;

                if (target.classList.contains('btn-delete')) {
                    if (confirm('Are you sure you want to delete this banner?')) {
                        try {
                            const { data: banner } = await supabase.from('champion_banners').select('image_path').eq('id', id).single();
                            if (banner && banner.image_path) {
                                await supabase.storage.from('images').remove([banner.image_path]);
                            }
                            const { error } = await supabase.from('champion_banners').delete().eq('id', id);
                            if (error) throw error;
                            await displayChampionBanners();
                        } catch (error) {
                            alert('Error deleting banner: ' + error.message);
                        }
                    }
                }

                if (target.classList.contains('btn-edit')) {
                    const { data: banner, error } = await supabase.from('champion_banners').select('*').eq('id', id).single();
                    if (banner) {
                        championIdInput.value = banner.id;
                        championTitleInput.value = banner.title;
                        championOrderInput.value = banner.display_order;
                        championImageInput.required = false;
                        cancelEditBtn.style.display = 'inline-block';
                        championForm.querySelector('button[type="submit"]').textContent = 'Update Banner';
                        document.getElementById('champions-admin-section').scrollIntoView({ behavior: 'smooth' });
                    }
                }

                if (target.classList.contains('status-toggle')) {
                    const newStatus = target.checked;
                    try {
                        const { error } = await supabase.from('champion_banners').update({ is_active: newStatus }).eq('id', id);
                        if (error) throw error;
                    } catch (error) {
                        alert('Error updating status: ' + error.message);
                        target.checked = !newStatus; // Revert on failure
                    }
                }
            });

            championForm.addEventListener('submit', handleChampionSubmit);

            /**
             * Handles adding/deleting items for notices and updates.
             * This is a front-end only demonstration. Data is not saved.
             */
            function setupManagementSection(form, input, list) {
                // Load from localStorage for demo persistence
                const storageKey = `${list.id}-items`;
                let items = JSON.parse(localStorage.getItem(storageKey)) || [];

                function renderItems() {
                    list.innerHTML = '';
                    if (items.length === 0) {
                        list.innerHTML = `<p class="gallery-message">No items yet.</p>`;
                        return;
                    }
                    items.forEach((itemText, index) => {
                        const itemEl = document.createElement('div');
                        itemEl.className = 'list-item';
                        itemEl.innerHTML = `
                            <h4>${itemText}</h4>
                            <button class="btn btn-delete" data-index="${index}">Delete</button>
                        `;
                        list.appendChild(itemEl);
                    });
                }

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newItemText = input.value.trim();
                    if (newItemText) {
                        items.push(newItemText);
                        localStorage.setItem(storageKey, JSON.stringify(items));
                        form.reset();
                        renderItems();
                    }
                });

                list.addEventListener('click', (e) => {
                    if (e.target.classList.contains('btn-delete')) {
                        const index = e.target.dataset.index;
                        items.splice(index, 1);
                        localStorage.setItem(storageKey, JSON.stringify(items));
                        renderItems();
                    }
                });

                renderItems();
            }

            // --- Event Listeners ---

            // Handle form submission for upload
            uploadForm.addEventListener('submit', handleUpload);

            // Use event delegation for delete buttons
            galleryGrid.addEventListener('click', (e) => {
                const deleteButton = e.target.closest('.btn-delete');
                if (deleteButton) {
                    const imageId = deleteButton.dataset.id;
                    deleteGalleryImage(imageId);
                }
            });

            // Setup management sections
            setupManagementSection(noticeForm, noticeTitleInput, noticesList);
            setupManagementSection(updateForm, updateTitleInput, updatesList);

            // Initial load of images
            displayImages();
            displayChampionBanners();

            // --- THEME TOGGLE ---
            const themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }
        });
    </script>

</body>
